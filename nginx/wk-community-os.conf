# ==============================================================================
# Nginx Reverse Proxy & Security Hardening Configuration
# Platform: Bumi Warga Enterprise (WK Community OS)
# Target: Kota Sukabumi / Jawa Barat Smart Province
# ==============================================================================

# Rate Limiting Zones (Anti-Brute Force & Anti-DDoS)
limit_req_zone $binary_remote_addr zone=bw_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bw_login_limit:10m rate=5r/m;

upstream bumi_warga_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bumiwarga.sukabumikota.go.id www.bumiwarga.sukabumikota.go.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bumiwarga.sukabumikota.go.id www.bumiwarga.sukabumikota.go.id;

    # SSL Certificates (Let's Encrypt Standard)
    ssl_certificate /etc/letsencrypt/live/bumiwarga.sukabumikota.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bumiwarga.sukabumikota.go.id/privkey.pem;

    # TLS Protocols & High Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enterprise Security Headers (Kepatuhan UU PDP No. 27/2022 & BSSN)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    # Gzip Compression for Optimal Latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Maximum Upload Limit (e-KTP scans, documents, biometric test payloads)
    client_max_body_size 15M;

    # Static Assets Fast-Delivery with Long-Term Cache (Vite Production Build)
    location /assets/ {
        alias /var/www/bumiwarga/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files (favicon, manifest, logo)
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        root /var/www/bumiwarga/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Rate Limiting for Authentication (Proteksi Brute-Force NIK)
    location /api/auth/login {
        limit_req zone=bw_login_limit burst=3 nodelay;

        proxy_pass http://bumi_warga_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway Endpoints (Protected with Global API Rate Limiter)
    location /api/ {
        limit_req zone=bw_api_limit burst=20 nodelay;

        proxy_pass http://bumi_warga_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Partner API Gateway (Sapawarga & Satu Data Jabar)
    location /api/v1/partner/ {
        proxy_pass http://bumi_warga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Monolith Fallback (Express serves public/index.html on non-API routes)
    location / {
        proxy_pass http://bumi_warga_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
